apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-factory-box-resources-readonly
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["agentfactory.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agentworkspaces", "agentworkers"]
  validations:
    - expression: >-
        request.userInfo.username == 'system:serviceaccount:agent-factory-system:agent-factory-controller' ||
        (request.operation == 'UPDATE' && object.spec == oldObject.spec)
      message: workspaces and workers are managed by their AgentBox; edit the box instead
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-factory-box-resources-readonly
spec:
  policyName: agent-factory-box-resources-readonly
  validationActions: ["Deny"]
