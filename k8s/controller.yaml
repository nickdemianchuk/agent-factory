apiVersion: v1
kind: Namespace
metadata:
  name: agent-factory-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-factory-controller
  namespace: agent-factory-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-factory-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-factory-controller
subjects:
  - kind: ServiceAccount
    name: agent-factory-controller
    namespace: agent-factory-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory-controller-leader-election
  namespace: agent-factory-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-factory-controller-leader-election
  namespace: agent-factory-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-factory-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: agent-factory-controller
    namespace: agent-factory-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-factory-controller
  namespace: agent-factory-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-factory-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-factory-controller
    spec:
      serviceAccountName: agent-factory-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-factory-controller
          image: controller
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          ports:
            - containerPort: 8081
              name: probes
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
